name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: mci-core
        working-directory: mci-core
        run: ./gradlew test --no-daemon
      - name: mci-web
        working-directory: mci-web
        run: ./gradlew test --no-daemon
