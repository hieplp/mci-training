<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCI — Big Number Sum</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">mci / add2num</p>
            <h1 class="title">Big Number Sum</h1>
            <p class="subtitle">Adds two non-negative integers of arbitrary length, column by column.</p>
        </header>

        <div class="layout">
            <form method="post" th:action="@{/}" class="calc-form" id="sum-form">
                <div class="field">
                    <label for="stn1">First number</label>
                    <input id="stn1" name="stn1" type="text" inputmode="numeric" required
                           th:value="${stn1}" placeholder="99999999999999999999">
                </div>
                <div class="field">
                    <label for="stn2">Second number</label>
                    <input id="stn2" name="stn2" type="text" inputmode="numeric" required
                           th:value="${stn2}" placeholder="1">
                </div>
                <button type="submit" class="btn">Compute sum</button>
            </form>

            <section class="output" aria-live="polite">
                <div th:if="${sum == null and error == null}" class="output-empty" id="empty-state">
                    Enter two numbers to see the column addition.
                </div>

                <div class="panel panel-result" id="result-panel" th:attr="hidden=${sum == null} ? '' : null">
                    <p class="panel-label">Result</p>
                    <p class="panel-value" id="result-value" th:text="${sum}"></p>
                </div>

                <div class="panel" id="steps-panel" hidden>
                    <p class="panel-label">Calculation progress</p>
                    <ol class="steps-list" id="steps-list"></ol>
                </div>

                <div class="panel panel-error" id="error-panel" th:attr="hidden=${error == null} ? '' : null">
                    <p class="panel-label">Invalid input</p>
                    <p class="panel-value" id="error-value" th:text="${error}"></p>
                </div>
            </section>
        </div>

        <footer class="foot">mci-training · v0.0.1</footer>
        <script th:src="@{/js/sum.js}" defer></script>
    </main>
</body>
</html>
