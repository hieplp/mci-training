<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCI — Big Number Sum</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">mci / add2num</p>
            <h1 class="title">Big Number Sum</h1>
            <p class="subtitle">Adds two non-negative integers of arbitrary length, column by column.</p>
        </header>

        <div class="layout">
            <form method="get" th:action="@{/}" class="calc-form">
                <div class="field">
                    <label for="stn1">First number</label>
                    <input id="stn1" name="stn1" type="text" inputmode="numeric" required
                           th:value="${stn1}" placeholder="99999999999999999999">
                </div>
                <div class="field">
                    <label for="stn2">Second number</label>
                    <input id="stn2" name="stn2" type="text" inputmode="numeric" required
                           th:value="${stn2}" placeholder="1">
                </div>
                <button type="submit" class="btn">Compute sum</button>
            </form>

            <section class="output" aria-live="polite">
                <div th:if="${sum == null and error == null}" class="output-empty">
                    Enter two numbers to see the column addition.
                </div>

                <div th:if="${sum != null}" class="panel panel-result">
                    <p class="panel-label">Result</p>
                    <p class="panel-value" th:text="${sum}"></p>
                </div>

                <div th:if="${sum != null}" class="panel">
                    <p class="panel-label">Calculation progress</p>
                    <ol class="steps-list">
                        <li th:each="s, iter : ${steps}" th:style="'--i: ' + ${iter.index}"
                            th:text="|${s.firstDigit} + ${s.secondDigit} + carry ${s.carryIn} = ${s.columnTotal}. Write ${s.resultDigit}, carry ${s.carryOut}. Result so far: ${sum.substring(sum.length() - s.index)}|"></li>
                    </ol>
                </div>

                <div th:if="${error != null}" class="panel panel-error">
                    <p class="panel-label">Invalid input</p>
                    <p class="panel-value" th:text="${error}"></p>
                </div>
            </section>
        </div>

        <footer class="foot">mci-training · v0.0.1</footer>
    </main>
</body>
</html>
